name: Deploy Documentation

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install mkdocs-material  # brings PyYAML, used by gen_llms_full.py

      - name: Generate LLM discovery files
        run: |
          #  - llms.txt: concise hand-curated index (canonical source at repo root)
          #  - llms-full.txt: full concatenated docs in nav order (generated, never hand-edited)
          cp llms.txt docs/llms.txt
          python scripts/gen_llms_full.py

      - run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
