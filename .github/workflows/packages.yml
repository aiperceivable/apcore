name: Core distribution verification

on:
  pull_request:
    paths: &sdk-paths
      - 'python/**'
      - 'rust/**'
      - 'typescript/**'
      - '.github/workflows/packages.yml'
  push:
    branches: [main]
    paths: *sdk-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Verify installed wheel
        shell: bash
        run: |
          wheel=( "$PWD"/dist/*.whl )
          temporary=$(mktemp -d)
          python -m venv "$temporary/venv"
          cd "$temporary"
          "$temporary/venv/bin/python" -m pip install "${wheel[0]}"
          "$temporary/venv/bin/python" -m pip check
          "$temporary/venv/bin/python" -c 'from apcore import APCore, Registry'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-python-distributions
          path: python/dist/

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo package --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-rust-distribution
          path: rust/target/package/*.crate

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify packed Node and browser entry points
        shell: bash
        run: |
          temporary=$(mktemp -d)
          mkdir -p "$GITHUB_WORKSPACE/dist-archives"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist-archives"
          archive=( "$GITHUB_WORKSPACE"/dist-archives/*.tgz )
          cd "$temporary"
          npm init -y
          npm install --ignore-scripts "${archive[0]}"
          node --input-type=module -e 'import {APCore} from "apcore-js"; import "apcore-js/context-keys"; if (!APCore) throw new Error("APCore is missing");'
          node --conditions=browser --input-type=module -e 'if (!import.meta.resolve("apcore-js").endsWith("/dist/browser/index.js")) throw new Error("browser entry did not resolve"); await import("apcore-js");'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-npm-distribution
          path: dist-archives/*.tgz
