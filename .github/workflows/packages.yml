name: Core distribution verification

on:
  pull_request:
    paths: &sdk-paths
      - 'python/**'
      - 'rust/**'
      - 'typescript/**'
      - 'docs/**'
      - 'conformance/extract_doc_examples.py'
      - '.github/workflows/packages.yml'
  push:
    branches: [main]
    paths: *sdk-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Verify installed wheel
        shell: bash
        run: |
          wheel=( "$PWD"/dist/*.whl )
          temporary=$(mktemp -d)
          python -m venv "$temporary/venv"
          cd "$temporary"
          "$temporary/venv/bin/python" -m pip install "${wheel[0]}"
          "$temporary/venv/bin/python" -m pip check
          "$temporary/venv/bin/python" -c 'from apcore import APCore, Registry; from importlib.util import find_spec; assert all(find_spec(name) is None for name in ("yaml", "watchdog", "aiohttp", "opentelemetry"))'
          "$temporary/venv/bin/python" -c 'from importlib.resources import files; assert files("apcore").joinpath("py.typed").is_file(), "installed wheel is missing apcore/py.typed"'
          python3 "$GITHUB_WORKSPACE/conformance/extract_doc_examples.py" python "$temporary"
          (cd quick-start && "$temporary/venv/bin/python" -I example.py)
          python -m venv "$temporary/full"
          "$temporary/full/bin/python" -m pip install "${wheel[0]}[all]"
          "$temporary/full/bin/python" -m pip check
          "$temporary/full/bin/python" -c 'from apcore.full import APCore, Config; from apcore.events import SubscriberRegistry; assert APCore(config=Config.from_defaults()).registry is not None'
          (cd governed-stream && "$temporary/full/bin/python" -I example.py)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-python-distributions
          path: python/dist/

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: 1.86.0
      - run: cargo package --locked --all-features
      - name: Run downstream examples against the packaged crate
        shell: bash
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          archives=( "$PWD"/target/package/*.crate )
          temporary=$(mktemp -d)
          cd "$temporary"
          mkdir sdk
          tar -xzf "${archives[0]}" --strip-components=1 -C sdk
          cp sdk/Cargo.lock Cargo.lock
          python3 "$GITHUB_WORKSPACE/conformance/extract_doc_examples.py" rust "$temporary"
          cat > Cargo.toml <<'EOF'
          [package]
          name = "apcore-doc-examples"
          version = "0.0.0"
          edition = "2021"
          rust-version = "1.86"

          [dependencies]
          apcore = { path = "sdk", features = ["config", "events"] }
          async-trait = "0.1.92"
          futures-util = "0.3"
          serde_json = "1"
          tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

          [[bin]]
          name = "quick-start"
          path = "quick-start/example.rs"

          [[bin]]
          name = "governed-stream"
          path = "governed-stream/example.rs"
          EOF
          (cd quick-start && cargo run --quiet --manifest-path ../Cargo.toml --bin quick-start)
          (cd governed-stream && cargo run --locked --quiet --manifest-path ../Cargo.toml --bin governed-stream)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-rust-distribution
          path: rust/target/package/*.crate

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.30.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the distribution
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist-archives"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/dist-archives"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20.0.0'
      - name: Run installed package checks on the Node floor
        shell: bash
        run: |
          temporary=$(mktemp -d)
          archive=( "$GITHUB_WORKSPACE"/dist-archives/*.tgz )
          cd "$temporary"
          npm init -y
          npm pkg set type=module
          npm install --ignore-scripts "${archive[0]}" typescript@5.5.4 @types/node@20
          node --input-type=module -e 'import {APCore} from "apcore-js"; import "apcore-js/context-keys"; if (!APCore) throw new Error("APCore is missing");'
          cat > verify-browser.mjs <<'EOF'
          const url = await import.meta.resolve("apcore-js");
          if (!url.endsWith("/dist/index.js")) throw new Error("browser entry did not resolve to the portable root");
          const core = await import("apcore-js");
          if (!core.APCore || "Config" in core) throw new Error("invalid Core Profile exports");
          EOF
          node --conditions=browser --experimental-import-meta-resolve verify-browser.mjs
          node --input-type=module -e 'import {accessSync} from "node:fs"; for (const entry of ["index", "core", "full", "config-entry", "discovery", "events/entry", "context-keys"]) accessSync(`node_modules/apcore-js/dist/${entry}.d.ts`);'
          node --input-type=module -e 'import {APCore} from "apcore-js/full"; import {Config} from "apcore-js/config"; import {createFilesystemDiscoveryPlugin} from "apcore-js/discovery"; if (!new APCore({config: new Config(), plugins: [createFilesystemDiscoveryPlugin()]}).registry) throw new Error("invalid full assembly");'
          python3 "$GITHUB_WORKSPACE/conformance/extract_doc_examples.py" typescript "$temporary"
          ./node_modules/.bin/tsc --strict --module NodeNext --target ES2022 --rootDir . --outDir compiled \
            quick-start/example.ts governed-stream/example.ts
          (cd quick-start && node ../compiled/quick-start/example.js)
          (cd governed-stream && node ../compiled/governed-stream/example.js)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-npm-distribution
          path: dist-archives/*.tgz
