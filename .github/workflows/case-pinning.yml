name: Case pinning

# Does any driver actually RUN each fixture case?
#
# `conformance-integrity.yml` answers two adjacent questions — does each SDK
# LOAD this fixture (check_driver_coverage) and does any driver READ this
# `expected` key (check_expected_keys_read). Neither answers this one. A case
# every driver skips or never reaches leaves both green, because the fixture is
# loaded and its key names are read by some OTHER case in the same file.
#
# The check is empirical, not static: mutate a case's expectation so no correct
# implementation can satisfy it, run the drivers that reference the fixture, and
# see whether anything goes red. Three static approaches were tried first and
# all measured their own pattern rather than the code — recorded in the tool's
# module docstring so they are not retried.
#
# SCHEDULED, not per-PR: four scopes x 651 mutated cases, each running real
# driver processes — roughly 80 minutes. Putting that on the
# PR path would make it the slowest gate in the repo for a property that changes
# only when a fixture case or a driver changes.
on:
  schedule:
    # 04:00 UTC daily — after the SDK repos' own nightly runs.
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      fixture:
        description: "Limit to one fixture (stem, no .json)"
        required: false
      sdk:
        description: "Ask the per-SDK question instead: python | typescript | rust"
        required: false

permissions:
  contents: read

jobs:
  pinning:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: apcore

      # The sweep runs the real drivers, so all three SDKs must be present and
      # buildable. A missing checkout is not a pass: the tool raises NoTestsRan
      # rather than reading "no tests ran" as "nothing went red", which is the
      # bug that manufactured its own first Rust result.
      - uses: actions/checkout@v4
        with:
          repository: aiperceivable/apcore-python
          path: apcore-python
      - uses: actions/checkout@v4
        with:
          repository: aiperceivable/apcore-typescript
          path: apcore-typescript
      - uses: actions/checkout@v4
        with:
          repository: aiperceivable/apcore-rust
          path: apcore-rust

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apcore-typescript/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable

      - name: Install SDKs
        run: |
          python3 -m pip install --quiet -e apcore-python[dev]
          pnpm --dir apcore-typescript install --frozen-lockfile
          cargo build --manifest-path apcore-rust/Cargo.toml --tests --all-features

      # Warm the Rust build so the first mutated case is not charged for a full
      # compile inside the per-case timeout.
      - name: Prebuild Rust tests
        run: cargo test --manifest-path apcore-rust/Cargo.toml --all-features --no-run

      # Four scopes. `any` is the weak question — does SOME driver run this case —
      # and it is kept because a wholly dead case fails it first and cheapest.
      # The three per-SDK scopes are the real gate: the sets are nearly disjoint
      # (84 gaps over 75 cases, 9 shared by two SDKs, none by all three), so `any`
      # read as zero while every SDK still had blind spots. Worse, fixing toward
      # `any` STOPS at the first SDK that turns the case green — call_chain's six
      # positive cases were fixed in apcore-python and stayed broken in the other
      # two for exactly that reason (apcore#93).
      - name: Every fixture case is run by some driver, and by each of them
        working-directory: apcore
        # The baseline is EMPTY: all 651 measurable cases are pinned as of
        # apcore#92. The diff below therefore fails on the first case that stops
        # being pinned, which is the state this job exists to hold. If the
        # baseline ever gains entries again, they are a backlog to shrink, not a
        # permanent exemption.
        run: |
          FIXTURE="${{ github.event.inputs.fixture }}"
          ONLY="${{ github.event.inputs.sdk }}"
          : > pinning.txt
          for scope in any python typescript rust; do
            [ -n "$ONLY" ] && [ "$scope" != "$ONLY" ] && continue
            echo "===== scope: $scope" | tee -a pinning.txt
            python3 conformance/check_case_pinning.py --sdk-root .. \
              ${FIXTURE:+--fixture "$FIXTURE"} \
              $([ "$scope" != any ] && echo "--sdk $scope") | tee -a pinning.txt
          done
          python3 - <<'PY'
          import json, re, sys
          from pathlib import Path
          scope, found = "any", {}
          for line in Path("pinning.txt").read_text().splitlines():
              m = re.match(r"===== scope: (\S+)", line)
              if m:
                  scope = m.group(1); continue
              m = re.match(r"\s*UNPINNED\s+(\S+)\s+::\s+(\S+)", line)
              if m:
                  found.setdefault(scope, {}).setdefault(m.group(1) + ".json", []).append(m.group(2))
          base = json.loads(Path("conformance/case_pinning_baseline.json").read_text())
          by_scope = base.get("by_scope", {})
          failed = 0
          for scope in ("any", "python", "typescript", "rust"):
              known = by_scope.get(scope, {}).get("unpinned", {})
              seen = found.get(scope, {})
              new = {f: sorted(set(v) - set(known.get(f, []))) for f, v in seen.items()}
              new = {f: v for f, v in new.items() if v}
              closed = {f: sorted(set(v) - set(seen.get(f, []))) for f, v in known.items()}
              closed = {f: v for f, v in closed.items() if v}
              for f, ids in sorted(closed.items()):
                  print(f"CLOSED [{scope}] {f}: {', '.join(ids)} — now run; drop it from the baseline")
              if new:
                  failed += sum(len(v) for v in new.values())
                  print(f"\n[{scope}] {sum(len(v) for v in new.values())} NEW unpinned:", file=sys.stderr)
                  for f, ids in sorted(new.items()):
                      print(f"  {f}: {', '.join(ids)}", file=sys.stderr)
          if failed:
              print("\nA case that cannot go red is not coverage. Assert it, or do not "
                    "declare it. A case one SDK is REQUIRED to skip belongs in "
                    "conformance/case_pinning_allowlist.json with the reason.", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Publish the sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: case-pinning
          path: apcore/pinning.txt
