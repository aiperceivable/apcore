name: Core SDK (typescript)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    env:
      CONFORMANCE_SPEC_REPO: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Verify canonical conformance fixture checkout
        run: pnpm exec vitest run tests/test-conformance-checkout.test.ts

      - name: Check characters and imports
        run: |
          pnpm exec apdev-js check-chars src tests examples
          pnpm exec apdev-js check-imports --package apcore-js

      - name: Typecheck library and examples
        run: pnpm run typecheck

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test:coverage
