name: Core SDK (typescript)

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    env:
      CONFORMANCE_SPEC_REPO: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: '10.30.1'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify canonical conformance fixture checkout
        run: pnpm exec vitest run tests/test-conformance-checkout.test.ts

      - name: Check characters and imports
        run: |
          pnpm exec apdev-js check-chars src tests examples
          pnpm exec apdev-js check-imports --package apcore-js

      - name: Typecheck library and examples
        run: pnpm run typecheck

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test:coverage
