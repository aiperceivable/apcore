name: Core SDK (rust)

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Test on Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.86.0", "stable"]

    steps:
      - name: Free disk space
        working-directory: ${{ github.workspace }}
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install apdev-rs
        if: matrix.rust == 'stable'
        run: cargo install apdev-rs --version 0.2.0 --locked

      - name: Check characters
        if: matrix.rust == 'stable'
        run: apdev-rs check-chars src/

      - name: Check formatting
        if: matrix.rust == 'stable'
        run: cargo fmt --all -- --check

      - name: Lint with Clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --locked --all-features

      - name: Test the in-memory Core Profile
        run: cargo test --locked --no-default-features --lib --test core_profile
        env:
          CONFORMANCE_SPEC_REPO: ${{ github.workspace }}

      - name: Run tests
        run: cargo test --locked --all-features
        env:
          CONFORMANCE_SPEC_REPO: ${{ github.workspace }}

      - name: Build examples
        run: cargo build --locked --examples
