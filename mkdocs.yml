site_name: apcore — AI-Perceivable Core
site_description: A governed, protocol-neutral runtime and module standard for agent-callable application capabilities.
site_url: https://apcore.aiperceivable.com/
repo_url: https://github.com/aiperceivable/apcore
repo_name: aiperceivable/apcore

theme:
  name: material
  logo: assets/apcore-logo.svg
  favicon: assets/apcore-logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

plugins:
  - search

markdown_extensions:
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Start Here:
      - Overview: index.md
      - Getting Started: getting-started.md
      - Core Concepts: concepts.md
      - Architecture: architecture.md
      - Positioning: POSITIONING.md
      - Glossary: glossary.md
  - Guides:
      - guides/index.md
      - Foundations:
          - Creating Modules: guides/creating-modules.md
          - Schema Definition: guides/schema-definition.md
          - Testing Modules: guides/testing-modules.md
      - Governance & Extension:
          - ACL Configuration: guides/acl-configuration.md
          - Writing Middleware: guides/middleware.md
      - Integration:
          - Multi-Language Development: guides/multi-language.md
          - Adapter Development: guides/adapter-development.md
          - Integrating Existing Projects: guides/integrating-existing-projects.md
      - Cookbooks:
          - Approval Flow: guides/cookbook-approval-flow.md
          - Cancellation: guides/cookbook-cancellation.md
          - Streaming: guides/cookbook-streaming.md
          - Observability: guides/cookbook-observability.md
      - Troubleshooting: guides/troubleshooting.md
  - Features:
      - features/index.md
      - Foundational Protocols:
          - Module Interface: features/module-interface.md
          - Context Object: features/context-object.md
          - APCore Client: features/apcore-client.md
          - Bindings (Decorator/YAML): features/decorator-bindings.md
          - ID Normalization: features/id-normalization.md
      - Execution & Workflow:
          - Core Executor: features/core-executor.md
          - Execution Pipeline: features/execution-pipeline.md
          - Streaming: features/streaming.md
          - Async Tasks: features/async-tasks.md
          - Cancellation: features/cancellation.md
      - Security & Governance:
          - ACL System: features/acl-system.md
          - Identity System: features/identity-system.md
          - Approval System: features/approval-system.md
          - Call Chain Guard: features/call-chain-guard.md
      - Reliability & Ops:
          - Observability & Tracing: features/observability.md
          - Metrics & Usage: features/metrics-and-usage.md
          - Error History: features/error-history.md
          - Redaction: features/redaction.md
          - Errors & AI Guidance: features/error-system.md
          - Event System: features/event-system.md
          - System Modules (system.*): features/system-modules.md
      - Framework Internals:
          - Registry System: features/registry-system.md
          - Schema System: features/schema-system.md
          - Config Bus: features/config-bus.md
          - Extension Points: features/extension-system.md
          - Middleware System: features/middleware-system.md
          - Multi-Module Discovery: features/multi-module-discovery.md
  - Specification:
      - spec/index.md
      - Normative:
          - Protocol Specification: spec/protocol-spec.md
          - Conformance: spec/conformance.md
          - Type Mapping: spec/type-mapping.md
          - API Surface & Naming: spec/api-surface-conventions.md
      - Reference:
          - Algorithm Reference: spec/algorithms.md
          - Security Considerations: spec/security-considerations.md
          - Durability Boundary: spec/design-durability-boundary.md
      - RFCs:
          - "RFC: include: Config Composition": spec/rfc-config-include.md
      - Decision Records:
          - Decision Register: spec/decision-register.md
          - "Divergence Decisions (D-129 –)": spec/2026-09-divergence-decisions.md
          - "Deep-Chain Decisions (D-74 – D-128)": spec/2026-09-deep-chain-decisions.md
          - "Config Surface Decisions (D-66 – D-73)": spec/2026-09-config-surface-decisions.md
          - "Consistency Audit Decisions (E-01 – E-03)": spec/2026-09-decision-log.md
          - "Decision Log 2026-05 (D-01 – D-65)": spec/2026-05-decision-log.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/aiperceivable/apcore
